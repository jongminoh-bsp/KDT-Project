apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: skyline-dev

namespace: skyline

resources:
- ../../base

patchesStrategicMerge:
- deployment-patch.yaml

configMapGenerator:
- name: skyline-config
  behavior: merge
  literals:
  - SPRING_PROFILES_ACTIVE=development
  - LOGGING_LEVEL_COM_EXAMPLE_SKYLINE=DEBUG

commonLabels:
  environment: dev

images:
- name: 646558765106.dkr.ecr.ap-northeast-2.amazonaws.com/skyline-dev
  newTag: dev-latest
